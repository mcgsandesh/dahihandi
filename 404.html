<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Maharashtracha Govinda</title>
    <script type="text/javascript">
      // 🎯 डायनॅमिक SPA Redirect Script (Custom Domain + Subfolder दोनहीसाठी सुरक्षित)
      var pathSegmentsToKeep = 0; // custom domain साठी 0, जर github subfolder असेल तर ते ऑटो डिटेक्ट होईल
      var l = window.location;

      // जर GitHub pages subfolder असेल तर repo path सांभाळणे
      if (l.hostname.indexOf('github.io') !== -1) {
        pathSegmentsToKeep = 1;
      }

      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
