    <!-- 🎯 404.html वरून येणारी लिंक अचूक री-स्टोअर करणारी कडक स्क्रिप्ट -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === 'p') {
          var pairs = l.search.slice(1).split('&');
          var r = pairs[0].split('=')[1].replace(/~and~/g, '&');
          if (r.slice(-1) === '/') r = r.slice(0, -1);
          
          // 🎯 ?t= किंवा इतर क्विरी पॅरामीटर्स योग्यरित्या री-स्टोअर करणे (q= काढून टाकणे)
          var queryString = '';
          if (pairs.length > 1) {
            var rawQuery = pairs.slice(1).join('&').replace(/~and~/g, '&');
            if (rawQuery.startsWith('q=')) {
              rawQuery = rawQuery.slice(2); // q= काढून टाकणे
            }
            queryString = '?' + rawQuery;
          }

          if (r !== '') {
            window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + (r.startsWith('/') ? r : '/' + r) +
              queryString +
              l.hash
            );
          }
        }
      }(window.location));
    </script>
